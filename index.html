<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aram Office – E-Governance Document Processing & Retrieval System</title>
  <meta name="description" content="E-Governance Document Processing and Retrieval System for Aram Office. Manage, search, and retrieve government documents efficiently." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-logo">
        <div class="logo-icon">
          <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
            <rect width="28" height="28" rx="6" fill="#1e40af"/>
            <path d="M7 8h14M7 12h10M7 16h12M7 20h8" stroke="white" stroke-width="2" stroke-linecap="round"/>
          </svg>
        </div>
        <div class="logo-text">
          <span class="logo-title">Aram Office</span>
          <span class="logo-sub">E-Governance</span>
        </div>
      </div>
      <button class="sidebar-toggle-btn" id="sidebarClose" aria-label="Close sidebar">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M15 5L5 15M5 5l10 10" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
    </div>

    <nav class="sidebar-nav">
      <div class="nav-section-label">Main Menu</div>
      <ul class="nav-list">
        <li class="nav-item active" data-page="dashboard" id="nav-dashboard">
          <span class="nav-icon">
            <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><rect x="1" y="1" width="7" height="7" rx="1.5" fill="currentColor"/><rect x="10" y="1" width="7" height="7" rx="1.5" fill="currentColor" opacity="0.5"/><rect x="1" y="10" width="7" height="7" rx="1.5" fill="currentColor" opacity="0.5"/><rect x="10" y="10" width="7" height="7" rx="1.5" fill="currentColor"/></svg>
          </span>
          <span class="nav-label">Dashboard</span>
        </li>
        <li class="nav-item" data-page="documents" id="nav-documents">
          <span class="nav-icon">
            <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><path d="M3 2h9l4 4v11a1 1 0 01-1 1H3a1 1 0 01-1-1V3a1 1 0 011-1z" stroke="currentColor" stroke-width="1.5" fill="none"/><path d="M11 2v4h4" stroke="currentColor" stroke-width="1.5" fill="none"/><path d="M5 9h8M5 12h6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
          </span>
          <span class="nav-label">Documents</span>
        </li>
        <li class="nav-item" data-page="search" id="nav-search">
          <span class="nav-icon">
            <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><circle cx="8" cy="8" r="5.5" stroke="currentColor" stroke-width="1.5"/><path d="M12.5 12.5L16 16" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
          </span>
          <span class="nav-label">Smart Search</span>
        </li>
        <li class="nav-item" data-page="versions" id="nav-versions">
          <span class="nav-icon">
            <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><circle cx="9" cy="9" r="7.5" stroke="currentColor" stroke-width="1.5"/><path d="M9 5v4l3 2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
          </span>
          <span class="nav-label">Version Management</span>
        </li>
        <li class="nav-item" data-page="categories" id="nav-categories">
          <span class="nav-icon">
            <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><path d="M2 4h14M2 9h10M2 14h12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><circle cx="14" cy="9" r="2" fill="currentColor"/></svg>
          </span>
          <span class="nav-label">Category Tree</span>
        </li>
        <li class="nav-item" data-page="staff" id="nav-staff">
          <span class="nav-icon">
            <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><path d="M9 1.5l6 2.5v5c0 4-3 7-6 8-3-1-6-4-6-8V4l6-2.5z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><path d="M6.5 9l2 2 3.5-3.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </span>
          <span class="nav-label">Staff Portal</span>
        </li>
      </ul>

      <div class="nav-section-label" style="margin-top:16px;">Actions</div>
      <ul class="nav-list">
        <li class="nav-item" id="nav-add-doc" data-action="addDoc">
          <span class="nav-icon">
            <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><circle cx="9" cy="9" r="7.5" stroke="currentColor" stroke-width="1.5"/><path d="M9 5.5v7M5.5 9h7" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
          </span>
          <span class="nav-label">Add Document</span>
        </li>
      </ul>
    </nav>

    <div class="sidebar-footer">
      <div class="sidebar-footer-info">
        <span class="footer-badge">Mini Project</span>
        <span class="footer-text">Java OOP & DSA</span>
      </div>
    </div>
  </aside>

  <!-- Main Content -->
  <div class="main-wrapper" id="mainWrapper">
    <!-- Top Navbar -->
    <header class="topbar">
      <div class="topbar-left">
        <button class="hamburger-btn" id="sidebarOpen" aria-label="Open sidebar">
          <svg width="22" height="22" viewBox="0 0 22 22" fill="none"><path d="M3 6h16M3 11h16M3 16h16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
        <div class="breadcrumb" id="breadcrumb">
          <span class="breadcrumb-root">Aram Office</span>
          <span class="breadcrumb-sep">›</span>
          <span class="breadcrumb-current" id="breadcrumbCurrent">Dashboard</span>
        </div>
      </div>
      <div class="topbar-right">
        <div class="topbar-search">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><circle cx="7" cy="7" r="4.5" stroke="#64748b" stroke-width="1.5"/><path d="M10.5 10.5L14 14" stroke="#64748b" stroke-width="1.5" stroke-linecap="round"/></svg>
          <input type="text" placeholder="Quick search…" id="quickSearch" autocomplete="off" />
        </div>
        <button class="topbar-btn" id="topbarAddBtn" title="Add Document">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="7" stroke="currentColor" stroke-width="1.5"/><path d="M8 5v6M5 8h6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
          <span>Add Document</span>
        </button>
        <div id="topbarUserContainer"></div>
      </div>
    </header>

    <!-- Page Container -->
    <main class="page-container" id="pageContainer">
      <!-- Pages injected by JS -->
    </main>
  </div>

  <!-- Modal Overlay -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal-box" id="modalBox">
      <div class="modal-header">
        <h3 class="modal-title" id="modalTitle">Modal</h3>
        <button class="modal-close" id="modalClose" aria-label="Close modal">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M15 5L5 15M5 5l10 10" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
      </div>
      <div class="modal-body" id="modalBody"></div>
    </div>
  </div>

  <!-- Toast Notifications -->
  <div class="toast-container" id="toastContainer"></div>

  <script src="js/data.js"></script>
  <script src="js/trie.js"></script>
  <script src="js/search.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
